[package]
name = "Flowbit"
version = "0.2.0"
description = "A Tauri App"
authors = ["_Axa_lotL_"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["native-tls-vendored"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
regex = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "fs", "time"] }

reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
yt-dlp = { git = "https://github.com/Guilherme-j10/yt-dlp" }
serde_json = "1.0.149"
dirs = "6.0.0"
once_cell = "1.21.4"
parking_lot = "0.12"
zip = "8.6"
# Decodes yt-dlp output: on Windows it's in the ANSI codepage (cp1251), not UTF-8.
encoding_rs = "0.8"

# Kills the whole yt-dlp process group on cancel (yt-dlp is a PyInstaller
# binary that spawns a worker process, which must be killed along with the bootloader).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
